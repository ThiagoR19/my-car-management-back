services:
  - type: web
    name: my-car-management-api
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: my-car-management-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: required
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
